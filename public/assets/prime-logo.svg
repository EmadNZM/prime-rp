<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Copper Gradients -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA86C"/>
      <stop offset="25%" stop-color="#C8874B"/>
      <stop offset="50%" stop-color="#8E5224"/>
      <stop offset="75%" stop-color="#DF9F64"/>
      <stop offset="100%" stop-color="#643612"/>
    </linearGradient>

    <!-- Silver Metallic Gradients -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#DCDCDC"/>
      <stop offset="45%" stop-color="#9E9E9E"/>
      <stop offset="65%" stop-color="#E5E5E5"/>
      <stop offset="85%" stop-color="#7B7B7B"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>

    <linearGradient id="darkBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2010"/>
      <stop offset="100%" stop-color="#140B05"/>
    </linearGradient>

    <!-- Carbon Fiber Pattern -->
    <pattern id="carbonMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#121212"/>
      <path d="M0 0h4v4H0zm4 4h4v4H4z" fill="#1c1c1c"/>
      <path d="M4 0h4v4H4zm-4 4h4v4H0z" fill="#0c0c0c"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- BACKGROUND GLOW -->
  <circle cx="400" cy="300" r="220" fill="#C8874B" opacity="0.12" filter="url(#glowFilter)"/>

  <!-- ==================== CROWN ON TOP ==================== -->
  <g transform="translate(320, 50)">
    <!-- Crown Base Arch -->
    <path d="M 20 120 Q 80 135 140 120 L 135 145 Q 80 155 25 145 Z" fill="url(#copperGrad)" stroke="#643612" stroke-width="2"/>
    
    <!-- Crown Base Jewels -->
    <circle cx="40" cy="133" r="4" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="65" cy="136" r="4" fill="#C8874B"/>
    <circle cx="80" cy="137" r="5" fill="#FFFFFF"/>
    <circle cx="95" cy="136" r="4" fill="#C8874B"/>
    <circle cx="120" cy="133" r="4" fill="#FFFFFF" opacity="0.8"/>

    <!-- Crown Peaks -->
    <!-- Center Peak -->
    <polygon points="80,40 100,100 80,120 60,100" fill="url(#copperGrad)" stroke="#4A260C" stroke-width="2"/>
    <circle cx="80" cy="38" r="8" fill="#FFFFFF" stroke="url(#copperGrad)" stroke-width="3"/>

    <!-- Left Peak -->
    <polygon points="30,70 50,110 30,125 15,100" fill="url(#copperGrad)" stroke="#4A260C" stroke-width="2"/>
    <circle cx="30" cy="68" r="6" fill="#DF9F64"/>

    <!-- Right Peak -->
    <polygon points="130,70 145,100 130,125 110,110" fill="url(#copperGrad)" stroke="#4A260C" stroke-width="2"/>
    <circle cx="130" cy="68" r="6" fill="#DF9F64"/>

    <!-- Far Left Spike -->
    <polygon points="5,85 20,115 5,128 -5,110" fill="url(#copperGrad)" stroke="#4A260C" stroke-width="1.5"/>
    <circle cx="5" cy="85" r="4" fill="#FFFFFF"/>

    <!-- Far Right Spike -->
    <polygon points="155,85 165,110 155,128 140,115" fill="url(#copperGrad)" stroke="#4A260C" stroke-width="1.5"/>
    <circle cx="155" cy="85" r="4" fill="#FFFFFF"/>
  </g>

  <!-- ==================== LEFT "P" EMBLEM SHIELD ==================== -->
  <g id="shield-P" transform="translate(60, 40)">
    <!-- Outer Copper Bevel 1 -->
    <path d="M 120 100 L 260 170 L 260 210 L 160 260 L 160 380 L 90 340 L 90 120 Z" 
          fill="url(#copperGrad)" stroke="#3A2010" stroke-width="4"/>
    
    <!-- Outer Copper Bevel 2 - Arrow Segments -->
    <path d="M 140 130 L 230 180 L 230 200 L 150 240 L 150 330 L 115 310 L 115 145 Z" 
          fill="url(#darkBevel)"/>
    
    <!-- Carbon Mesh Inner -->
    <path d="M 155 150 L 210 185 L 210 195 L 140 225 L 140 290 L 125 280 L 125 160 Z" 
          fill="url(#carbonMesh)"/>

    <!-- Stepped Arrow Facets -->
    <polygon points="150,110 190,130 160,145 125,125" fill="#DF9F64"/>
    <polygon points="170,120 210,140 180,155 145,135" fill="#8E5224"/>
    <polygon points="190,130 230,150 200,165 165,145" fill="#DF9F64"/>
  </g>

  <!-- ==================== TEXT "PRIME" (BRUSHED CHROME SILVER) ==================== -->
  <g id="text-prime" transform="translate(200, 240)">
    <!-- Background Shadow Extrusion -->
    <text x="5" y="5" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="124" font-weight="900" font-style="italic" fill="#0A0A0A" letter-spacing="2">
      PRIME
    </text>
    <text x="3" y="3" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="124" font-weight="900" font-style="italic" fill="#3D3D3D" letter-spacing="2">
      PRIME
    </text>
    <!-- Main Silver Metallic Layer -->
    <text x="0" y="0" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="124" font-weight="900" font-style="italic" fill="url(#silverGrad)" stroke="#1F1F1F" stroke-width="2" letter-spacing="2">
      PRIME
    </text>

    <!-- Jagged Speed Cuts Overlay -->
    <path d="M 30 -50 L 50 -10 L 40 -15 L 20 -55 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 160 -60 L 180 -20 L 170 -25 L 150 -65 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 280 -70 L 305 -30 L 295 -35 L 270 -75 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 400 -60 L 420 -15 L 410 -20 L 390 -65 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Sharp Right Splinter Lightning -->
    <polygon points="480,-40 540,-20 490,-10 560,10 470,0" fill="url(#silverGrad)" stroke="#3A3A3A"/>
  </g>

  <!-- ==================== TEXT "RP" (GLOWING METALLIC COPPER) ==================== -->
  <g id="text-rp" transform="translate(270, 390)">
    <!-- Shadow Extrusions -->
    <text x="6" y="6" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="140" font-weight="900" font-style="italic" fill="#140800" letter-spacing="4">
      RP
    </text>
    <text x="3" y="3" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="140" font-weight="900" font-style="italic" fill="#4E230B" letter-spacing="4">
      RP
    </text>

    <!-- Main Copper Gradient -->
    <text x="0" y="0" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="140" font-weight="900" font-style="italic" fill="url(#copperGrad)" stroke="#3A1C07" stroke-width="3" letter-spacing="4" filter="url(#glowFilter)">
      RP
    </text>

    <!-- Speed Jagged Spikes for RP -->
    <!-- Left Spikes on R -->
    <polygon points="-50,-30 10,-40 -20,-20 30,-15 -40,10" fill="url(#copperGrad)"/>
    <!-- Bottom Sharp Spikes on R leg -->
    <polygon points="80,10 90,60 110,15 130,70 125,5" fill="url(#copperGrad)"/>
    <!-- Right Spikes on P -->
    <polygon points="260,-40 330,-20 280,-10 350,15 270,10" fill="url(#copperGrad)"/>
    <polygon points="250,10 310,40 260,35 320,60 240,40" fill="url(#copperGrad)"/>
  </g>

  <!-- Light Sparkles / Flares -->
  <g id="sparkles">
    <polygon points="320,70 325,85 340,90 325,95 320,110 315,95 300,90 315,85" fill="#FFF" opacity="0.8"/>
    <circle cx="320" cy="90" r="3" fill="#FFE2C2"/>

    <polygon points="240,180 243,190 255,193 243,196 240,206 237,196 225,193 237,190" fill="#FFF" opacity="0.7"/>

    <polygon points="560,280 563,290 575,293 563,296 560,306 557,296 545,293 557,290" fill="#FFE2C2" opacity="0.9"/>
  </g>
</svg>
