<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" fill="none">
  <defs>
    <!-- Copper Metallic Gradient -->
    <linearGradient id="primeCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6A5"/>
      <stop offset="20%" stop-color="#F39C48"/>
      <stop offset="40%" stop-color="#D97A26"/>
      <stop offset="60%" stop-color="#B35B10"/>
      <stop offset="85%" stop-color="#DE8C3B"/>
      <stop offset="100%" stop-color="#5A2805"/>
    </linearGradient>

    <!-- Deep Bevel Copper Shadow -->
    <linearGradient id="primeCopperDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#572808"/>
      <stop offset="50%" stop-color="#2D1302"/>
      <stop offset="100%" stop-color="#0F0601"/>
    </linearGradient>

    <!-- Bright Gold / Amber Crown Gradient -->
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1D6"/>
      <stop offset="25%" stop-color="#F6B864"/>
      <stop offset="50%" stop-color="#C8822A"/>
      <stop offset="75%" stop-color="#8E530F"/>
      <stop offset="100%" stop-color="#462402"/>
    </linearGradient>

    <!-- Steel / Silver Chiseled Gradient -->
    <linearGradient id="brushedSteel" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#EAEAEA"/>
      <stop offset="35%" stop-color="#B0B0B0"/>
      <stop offset="50%" stop-color="#707070"/>
      <stop offset="65%" stop-color="#D5D5D5"/>
      <stop offset="85%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#9C9C9C"/>
    </linearGradient>

    <!-- Steel Bevel Extrusion -->
    <linearGradient id="steelExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F2F2F"/>
      <stop offset="50%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <!-- Carbon Fiber Honeycomb Pattern -->
    <pattern id="carbonHoneycomb" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#141414"/>
      <polygon points="6,1 11,4 11,8 6,11 1,8 1,4" fill="#202020" stroke="#0D0D0D" stroke-width="0.8"/>
      <polygon points="6,3 9,5 9,7 6,9 3,7 3,5" fill="#181818"/>
    </pattern>

    <!-- Glowing Highlights Filter -->
    <filter id="esportsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- BACKGROUND RADIAL ORANGE AMBIENT GLOW -->
  <circle cx="550" cy="380" r="320" fill="#F39C48" opacity="0.14" filter="url(#esportsGlow)"/>

  <!-- ======================================================== -->
  <!-- 1. LEFT 3D MULTI-TIERED GEOMETRIC 'P' EMBLEM            -->
  <!-- ======================================================== -->
  <g id="shield-emblem-P">
    <!-- Drop Shadow -->
    <path d="M 120 180 L 460 300 L 460 350 L 320 400 L 320 540 L 230 490 L 230 260 L 120 220 Z" 
          fill="#000000" opacity="0.8" transform="translate(15, 20)"/>

    <!-- Outer Deep Extrusion -->
    <path d="M 120 180 L 460 300 L 460 370 L 320 420 L 320 560 L 210 500 L 210 240 L 120 200 Z" 
          fill="url(#primeCopperDark)" stroke="#0D0602" stroke-width="4"/>

    <!-- Main Outer Copper Bevel Rim -->
    <path d="M 130 190 L 450 305 L 450 360 L 330 405 L 330 540 L 225 490 L 225 245 L 130 205 Z" 
          fill="url(#primeCopper)" stroke="#FFE2BF" stroke-width="2"/>

    <!-- Internal Recessed Bevel -->
    <path d="M 155 210 L 420 310 L 420 345 L 340 375 L 340 480 L 245 440 L 245 255 L 155 220 Z" 
          fill="url(#primeCopperDark)"/>

    <!-- Carbon Fiber Inset Plate -->
    <path d="M 170 225 L 395 315 L 395 335 L 350 355 L 350 450 L 260 415 L 260 270 L 170 235 Z" 
          fill="url(#carbonHoneycomb)" stroke="#B35B10" stroke-width="1.5"/>

    <!-- Layer 2 Chevron Inner Inset (Arrow Segment) -->
    <path d="M 180 300 L 270 340 L 270 370 L 180 330 Z" fill="url(#primeCopper)" stroke="#FFEDB8" stroke-width="1.5"/>
    <path d="M 200 370 L 290 410 L 290 440 L 200 400 Z" fill="url(#primeCopper)" stroke="#FFEDB8" stroke-width="1.5"/>

    <!-- Top Highlight Ridge Lines on P -->
    <line x1="130" y1="190" x2="450" y2="305" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <line x1="130" y1="205" x2="225" y2="245" stroke="#FFD6A5" stroke-width="2"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. ROYAL KING CROWN (Sitting above the letter I and M)   -->
  <!-- ======================================================== -->
  <g id="royal-crown" transform="translate(420, 20)">
    <!-- Crown Drop Shadow -->
    <path d="M 40 180 Q 150 200 260 180 L 290 100 L 210 130 L 150 20 L 90 130 L 10 100 Z" 
          fill="#000000" opacity="0.75" transform="translate(10, 15)"/>

    <!-- Main Golden Crown Body -->
    <path d="M 40 180 Q 150 205 260 180 L 305 85 L 215 125 L 150 15 L 85 125 -5 85 Z" 
          fill="url(#crownGold)" stroke="#3A1C02" stroke-width="4"/>

    <!-- Crown Base Arch Band -->
    <path d="M 30 180 Q 150 215 270 180 L 265 205 Q 150 240 35 205 Z" 
          fill="url(#primeCopper)" stroke="#FFE8BD" stroke-width="2.5"/>

    <!-- Crown Base Jewels & Rivets -->
    <circle cx="65" cy="198" r="6" fill="#1A1A1A" stroke="#FFD6A5" stroke-width="2"/>
    <circle cx="105" cy="206" r="6.5" fill="#FFEAA7" stroke="#8E530F" stroke-width="2"/>
    <circle cx="150" cy="210" r="8" fill="#140600" stroke="#FFD6A5" stroke-width="2.5"/>
    <circle cx="195" cy="206" r="6.5" fill="#FFEAA7" stroke="#8E530F" stroke-width="2"/>
    <circle cx="235" cy="198" r="6" fill="#1A1A1A" stroke="#FFD6A5" stroke-width="2"/>

    <!-- Crown Diamond Jewels inside arch -->
    <polygon points="150,150 162,165 150,180 138,165" fill="#120600" stroke="#FFD6A5" stroke-width="1.5"/>
    <polygon points="100,155 110,168 100,178 90,168" fill="#120600" stroke="#FFD6A5" stroke-width="1.5"/>
    <polygon points="200,155 210,168 200,178 190,168" fill="#120600" stroke="#FFD6A5" stroke-width="1.5"/>

    <!-- Crown Spire Orbs -->
    <circle cx="150" cy="15" r="9" fill="#FFFFFF" stroke="#F6B864" stroke-width="3"/>
    <circle cx="85" cy="125" r="6" fill="#FFEDB8" stroke="#8E530F" stroke-width="2"/>
    <circle cx="215" cy="125" r="6" fill="#FFEDB8" stroke="#8E530F" stroke-width="2"/>
    <circle cx="-5" cy="85" r="5" fill="#FFFFFF" stroke="#8E530F" stroke-width="2"/>
    <circle cx="305" cy="85" r="5" fill="#FFFFFF" stroke="#8E530F" stroke-width="2"/>

    <!-- Crown Light Glint Highlights -->
    <polygon points="150,2 153,10 162,15 153,20 150,28 147,20 138,15 147,10" fill="#FFFFFF"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. BOLD CHISELED STEEL TEXT: "PRIME"                     -->
  <!-- ======================================================== -->
  <g id="text-PRIME" transform="translate(250, 420)">
    <!-- 3D Extrusion Shadow Behind -->
    <text x="10" y="10" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="160" font-weight="900" font-style="italic" fill="#000000" letter-spacing="1">
      PRIME
    </text>
    <text x="6" y="6" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="160" font-weight="900" font-style="italic" fill="url(#steelExtrude)" letter-spacing="1">
      PRIME
    </text>

    <!-- Main Chiseled Brushed Steel Front Surface -->
    <text x="0" y="0" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="160" font-weight="900" font-style="italic" fill="url(#brushedSteel)" stroke="#111111" stroke-width="3.5" letter-spacing="1">
      PRIME
    </text>

    <!-- Sharp Brushed Metal Slash Accents & Shards Across Letters -->
    <polygon points="50,-80 85,-20 70,-20 40,-80" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="170,-110 205,-30 190,-30 160,-110" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="320,-120 360,-40 340,-40 305,-120" fill="#FFFFFF" opacity="0.7"/>
    <polygon points="460,-100 495,-20 480,-20 445,-100" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="580,-90 615,-10 600,-10 565,-90" fill="#FFFFFF" opacity="0.7"/>

    <!-- Sharp Sharded Serrated Cutouts on Right Edge of 'E' -->
    <polygon points="630,-120 730,-90 650,-70 750,-40 640,-20 730,10 620,0" fill="url(#brushedSteel)" stroke="#1C1C1C" stroke-width="2"/>
    <polygon points="630,-120 730,-90 650,-70 750,-40" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. FIERY COPPER SHARDED TEXT: "RP"                       -->
  <!-- ======================================================== -->
  <g id="text-RP" transform="translate(340, 620)">
    <!-- 3D Shadow -->
    <text x="12" y="12" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="200" font-weight="900" font-style="italic" fill="#0D0400" letter-spacing="4">
      RP
    </text>
    <text x="7" y="7" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="200" font-weight="900" font-style="italic" fill="url(#primeCopperDark)" letter-spacing="4">
      RP
    </text>

    <!-- Main Front Glowing Copper Surface -->
    <text x="0" y="0" font-family="'Montserrat', 'Rajdhani', Impact, sans-serif" font-size="200" font-weight="900" font-style="italic" fill="url(#primeCopper)" stroke="#4A1E04" stroke-width="5" letter-spacing="4" filter="url(#esportsGlow)">
      RP
    </text>

    <!-- Aggressive Sharded Lightning Spikes Emanating from 'R' (Left) -->
    <polygon points="-120,-40 -20,-60 -70,-30 0,-10 -90,20 -10,30 -80,60" fill="url(#primeCopper)" stroke="#FFDFB3" stroke-width="2"/>
    <polygon points="-70,50 -10,70 -90,110 20,80 -60,130" fill="url(#primeCopper)" stroke="#3A1C02" stroke-width="1.5"/>

    <!-- Spikes along Bottom of 'R' and 'P' -->
    <polygon points="120,30 140,110 165,40 190,125 180,25" fill="url(#primeCopper)" stroke="#FFDFB3" stroke-width="2"/>
    <polygon points="280,30 305,115 325,45 350,130 340,25" fill="url(#primeCopper)" stroke="#FFDFB3" stroke-width="2"/>

    <!-- Extreme Sharp Right Spikes Emanating from 'P' (Right Wing) -->
    <polygon points="380,-60 480,-30 400,-15 510,20 410,35 480,75 370,50" fill="url(#primeCopper)" stroke="#FFDFB3" stroke-width="2"/>
    <polygon points="360,60 440,110 370,105 450,150 330,110" fill="url(#primeCopper)" stroke="#3A1C02" stroke-width="2"/>
  </g>

  <!-- ======================================================== -->
  <!-- 5. OPTICAL LENS FLARES & SPARKLES                        -->
  <!-- ======================================================== -->
  <g id="sparkle-flares">
    <!-- Star Glint 1: On P emblem crest -->
    <g transform="translate(130, 190)">
      <polygon points="0,-25 6,-7 25,0 6,7 0,25 -6,7 -25,0 -6,-7" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#FFE5C4"/>
    </g>

    <!-- Star Glint 2: On Letter 'P' Top Ridge -->
    <g transform="translate(240, 245)">
      <polygon points="0,-18 4,-5 18,0 4,5 0,18 -4,5 -18,0 -4,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#FFE5C4"/>
    </g>

    <!-- Star Glint 3: On Crown Center Spire -->
    <g transform="translate(570, 35)">
      <polygon points="0,-24 5,-6 24,0 5,6 0,24 -5,6 -24,0 -5,-6" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#FFF4E0"/>
    </g>

    <!-- Star Glint 4: On 'PRIME' text first corner -->
    <g transform="translate(270, 310)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Star Glint 5: On 'RP' center intersection -->
    <g transform="translate(480, 500)">
      <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#FFE5C4"/>
    </g>

    <!-- Star Glint 6: On 'RP' bottom spike -->
    <g transform="translate(490, 720)">
      <polygon points="0,-18 4,-5 18,0 4,5 0,18 -4,5 -18,0 -4,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#FFC98A"/>
    </g>

    <!-- Star Glint 7: Far Right Shard Flare -->
    <g transform="translate(850, 640)">
      <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#FFE5C4"/>
    </g>
  </g>
</svg>
